markets:
  server:
    enabled: true
    label: "Serveurs / Compute"
    keywords: ["serveur", "serveurs", "server", "servers", "compute node", "blade server", "rack server", "infrastructure de calcul"]
    cpv: ["48820000", "30211000"]
    weight: 25
  gpu:
    enabled: true
    label: "GPU / HPC / IA"
    keywords: ["gpu", "nvidia", "cuda", "h100", "h200", "b200", "accelerator", "accelerateur", "high performance computing", "hpc"]
    cpv: ["30200000"]
    weight: 30
  storage:
    enabled: true
    label: "Stockage / Backup"
    keywords: ["stockage", "storage", "san", "nas", "object storage", "backup", "sauvegarde", "immutable backup", "disaster recovery"]
    cpv: ["30233100", "30233000"]
    weight: 24
  virtualization:
    enabled: true
    label: "Virtualisation / Private Cloud"
    keywords: ["virtualisation", "virtualization", "vmware", "proxmox", "hyper-v", "private cloud", "cloud prive", "hyperconverged", "hci"]
    weight: 20
  network:
    enabled: true
    label: "Reseau Datacenter"
    keywords: ["reseau", "network", "ethernet", "infiniband", "100gbe", "400gbe", "switch datacenter", "spine leaf"]
    cpv: ["32420000", "32422000"]
    weight: 18
  datacenter:
    enabled: true
    label: "Datacenter / Salle IT"
    keywords: ["datacenter", "data center", "centre de donnees", "salle informatique", "infrastructure informatique", "infrastructure it"]
    weight: 22
  cloud_repatriation:
    enabled: true
    label: "FinOps / Cloud Repatriation"
    keywords: ["finops", "cloud cost", "cout cloud", "cloud repatriation", "rapatriement cloud", "hybrid cloud", "cloud hybride"]
    weight: 20

