sectors:
  - id: ai
    enabled: true
    label: "IA / Machine Learning"
    keywords: ["intelligence artificielle", "artificial intelligence", "machine learning", "deep learning", "generative ai", "gpu", "cuda", "inference", "llm"]
    weight: 20
  - id: biotech
    enabled: true
    label: "Biotech / Bioinformatique"
    keywords: ["bioinformatique", "bioinformatics", "sequencing", "genomique", "genomics", "hpc", "computational biology"]
    weight: 16
  - id: industry
    enabled: true
    label: "Industrie 4.0"
    keywords: ["industrie 4.0", "industry 4.0", "digital twin", "simulation", "edge computing", "vision industrielle", "computer vision"]
    weight: 14
  - id: healthcare
    enabled: true
    label: "Sante / HealthTech"
    keywords: ["healthtech", "imagerie medicale", "medical imaging", "hopital", "hospital", "donnees de sante", "health data"]
    weight: 15
  - id: finance
    enabled: true
    label: "Finance / FinTech / Assurance"
    keywords: ["fintech", "assurance", "insurance", "banque", "bank", "trading", "risk engine"]
    weight: 13
  - id: hosting
    enabled: true
    label: "Hebergement / MSP / Cloud prive"
    keywords: ["hebergeur", "hosting", "managed service provider", "msp", "private cloud", "cloud prive", "datacenter"]
