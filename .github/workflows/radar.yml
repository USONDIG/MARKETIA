name: MARKETIA Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "15 5,11,17,23 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: marketia-radar
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate code
        run: |
          python -m compileall -q .
          pytest -q

      - name: Run collectors, scoring and exports
        run: python main.py

      - name: Show generated alerts
        if: always()
        run: |
          echo "## MARKETIA Radar" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/alerts.csv ]; then
            COUNT=$(($(wc -l < output/alerts.csv)-1))
            echo "Alertes générées: $COUNT" >> "$GITHUB_STEP_SUMMARY"
            head -n 21 output/alerts.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Aucun fichier d'alertes généré." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish rolling GitHub alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(($(wc -l < output/alerts.csv)-1))
          if [ "$COUNT" -gt 0 ]; then
            BODY=$(mktemp)
            {
              echo "# MARKETIA Radar Alerts"
              echo
              echo "Dernière mise à jour automatique : $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo
              echo "**$COUNT opportunité(s) au-dessus du seuil configuré.**"
              echo
              echo '```csv'
              head -n 31 output/alerts.csv
              echo '```'
              echo
              echo "Le détail complet est disponible dans \`output/server_infra_radar.xlsx\`."
            } > "$BODY"
            ISSUE=$(gh issue list --state open --search 'MARKETIA Radar Alerts in:title' --json number,title --jq '.[] | select(.title == "MARKETIA Radar Alerts") | .number' | head -n 1)
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --body-file "$BODY"
            else
              gh issue create --title "MARKETIA Radar Alerts" --body-file "$BODY"
            fi
          fi

      - name: Persist database and outputs
        run: |
          git config user.name "marketia-radar-bot"
          git config user.email "marketia-radar-bot@users.noreply.github.com"
          git add data/radar.db output/server_infra_radar.xlsx output/alerts.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: automatic MARKETIA radar update [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
